<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EVG Portal | Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ========================================
   RESET & CSS VARIABLES
   ======================================== */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #F5F4F0;
    --surface: #FFFFFF;
    --border: rgba(0, 0, 0, 0.09);
    --text: #1A1916;
    --muted: #6B6A66;
    --faint: #A09F9C;
    --accent: #1B5E3B;
    --radius: 14px;
}

/* ========================================
   BODY & TYPOGRAPHY
   ======================================== */
body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
}

/* ========================================
   HEADER
   ======================================== */
header {
    background: var(--surface);
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}

.header-link {
    display: block;
    color: inherit;
    text-decoration: none;
}

.hdr-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
}

.hdr-sub {
    margin-top: 3px;
    font-size: 12px;
    color: var(--faint);
}

/* ========================================
   MAIN CONTENT
   ======================================== */
main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px 40px;
}

.card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 44px 24px;
    text-align: center;
}

/* ========================================
   STATUS INDICATOR
   ======================================== */
.status-indicator {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 14px;
    margin-bottom: 28px;
    border-radius: 100px;
    background: #EEEDEA;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

/* ========================================
   MAIN MESSAGE
   ======================================== */
h1 {
    font-size: clamp(34px, 9vw, 48px);
    line-height: 1.08;
    letter-spacing: -1.8px;
    font-weight: 700;
    margin-bottom: 22px;
}

h1 span {
    display: block;
    color: var(--accent);
    margin-top: 8px;
}

.message {
    max-width: 340px;
    margin: 0 auto;
    font-size: 17px;
    line-height: 1.7;
    color: var(--muted);
}

.footer-note {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    color: var(--faint);
    font-size: 12px;
    line-height: 1.6;
}

/* ========================================
   SMALL SCREENS
   ======================================== */
@media (max-width: 360px) {
    .card {
        padding: 36px 18px;
    }

    h1 {
        font-size: 34px;
    }

    .message {
        font-size: 16px;
    }
}

/* ========================================
   LARGER SCREENS
   ======================================== */
@media (min-width: 600px) {
    main {
        padding: 40px 24px;
    }

    .card {
        padding: 56px 40px;
    }
}
</style>
</head>

<body>

<!-- ========================================
     HEADER
     ======================================== -->
<header>
    <a href="index.html" class="header-link">
        <div class="hdr-title">EVG Portal</div>
        <div class="hdr-sub">Education Volunteer Guide</div>
    </a>
</header>

<!-- ========================================
     UNAVAILABLE / COMING SOON MESSAGE
     ======================================== -->
<main>
    <section class="card">

        <div class="status-indicator">
            Currently Unavailable
        </div>

        <h1>
            Something New
            <span>Is Coming.</span>
        </h1>

        <p class="message">
            The EVG Portal is currently unavailable.
            Please making your bookings on WhatsApp.
            We're working on something new and look forward
            to welcoming you back soon.
        </p>

        <div class="footer-note">
            Education Volunteer Guide
        </div>

    </section>
</main>

</body>
</html>
